<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Passenger Details | BusGo</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="passenger.css">
    <link rel="icon" type="image/png" href="favicon.png">

</head>

<body>

<section class="passenger-page">

    <div class="passenger-card">

        <h1>Passenger Details</h1>

        <h3>
            Selected Seats :
            <span id="seatList"></span>
        </h3>

        <form id="passengerForm">

            <div class="input-box">
                <label>Full Name</label>
                <input
                type="text"
                id="name"
                required>
            </div>

            <div class="input-box">
                <label>Age</label>
                <input
                type="number"
                id="age"
                min="1"
                required>
            </div>

            <div class="input-box">

                <label>Gender</label>

                <select id="gender">

                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>

                </select>

            </div>

            <div class="input-box">

                <label>Mobile Number</label>

                <input
                type="tel"
                id="mobile"
                required>

            </div>

            <div class="input-box">

                <label>Email</label>

                <input
                type="email"
                id="email"
                required>

            </div>

            <button type="submit">

                Continue to Payment

            </button>

        </form>

    </div>

</section>

<script src="passenger.js"></script>

</body>

</html>

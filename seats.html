<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Select Seat | BusGo</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="seat.css">
<link rel="icon" type="image/png" href="favicon.png">

</head>

<body>

<section class="seat-page">

    <h1>Select Your Seat</h1>

    <div class="seat-container">

        <!-- Seat Layout -->

        <div class="bus-layout">

            <h3>🚌 Driver</h3>

            <div class="seat-grid">

    <!-- Row 1 -->
    <div class="seat" data-seat="A1">A1</div>
    <div class="seat women" data-seat="A2">A2 ♀</div>

    <div class="gap"></div>

    <div class="seat" data-seat="A3">A3</div>
    <div class="seat women" data-seat="A4">A4 ♀</div>

    <!-- Row 2 -->
    <div class="seat" data-seat="B1">B1</div>
    <div class="seat booked">B2</div>

    <div class="gap"></div>

    <div class="seat" data-seat="B3">B3</div>
    <div class="seat" data-seat="B4">B4</div>

    <!-- Row 3 -->
    <div class="seat" data-seat="C1">C1</div>
    <div class="seat" data-seat="C2">C2</div>

    <div class="gap"></div>

    <div class="seat" data-seat="C3">C3</div>
    <div class="seat" data-seat="C4">C4</div>

    <!-- Row 4 -->
    <div class="seat" data-seat="D1">D1</div>
    <div class="seat women" data-seat="D2">D2 ♀</div>

    <div class="gap"></div>

    <div class="seat" data-seat="D3">D3</div>
    <div class="seat women" data-seat="D4">D4 ♀</div>

    <!-- Row 5 -->
    <div class="seat booked">E1</div>
    <div class="seat" data-seat="E2">E2</div>

    <div class="gap"></div>

    <div class="seat" data-seat="E3">E3</div>
    <div class="seat" data-seat="E4">E4</div>

    <!-- Row 6 -->
    <div class="seat" data-seat="F1">F1</div>
    <div class="seat" data-seat="F2">F2</div>

    <div class="gap"></div>

    <div class="seat booked">F3</div>
    <div class="seat" data-seat="F4">F4</div>

    <!-- Row 7 -->
    <div class="seat" data-seat="G1">G1</div>
    <div class="seat" data-seat="G2">G2</div>

    <div class="gap"></div>

    <div class="seat" data-seat="G3">G3</div>
    <div class="seat" data-seat="G4">G4</div>

</div>

        </div>

        <!-- Booking Summary -->

        <div class="summary">

            <h2>Booking Summary</h2>

            <p><strong>Selected Seats:</strong></p>

            <div id="selectedSeats">
                None
            </div>

            <hr>

            <p>Seat Price : ₹650</p>

            <p>Total Seats :
                <span id="count">0</span>
            </p>

            <h3>
                Total : ₹
                <span id="total">0</span>
            </h3>

            <button id="continueBtn">
                Continue
            </button>

        </div>

    </div>

</section>

<script src="seat.js"></script>

</body>

</html>

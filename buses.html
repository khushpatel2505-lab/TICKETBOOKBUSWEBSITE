<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Available Buses | BusGo</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="bus.css">
<link rel="icon" type="image/png" href="favicon.png">

</head>

<body>

<section class="bus-list">

    <h1>Available Buses</h1>

    <div class="bus-container">

        <!-- Bus Card 1 -->

        <div class="bus-card">

            <div class="bus-left">

                <h2>🚌 Express Travels</h2>

                <p>⭐⭐⭐⭐⭐ 4.8</p>

                <p><strong>Departure:</strong> 08:00 AM</p>

                <p><strong>Arrival:</strong> 02:30 PM</p>

                <p><strong>Duration:</strong> 6h 30m</p>

            </div>

            <div class="bus-right">

                <p>Seats Left</p>

                <h2>18</h2>

                <p>AC Sleeper</p>

                <h3>₹650</h3>

                <button onclick="location.href='seats.html'">
                    View Seats
                </button>

            </div>

        </div>

        <!-- Bus Card 2 -->

        <div class="bus-card">

            <div class="bus-left">

                <h2>🚌 Patel Travels</h2>

                <p>⭐⭐⭐⭐☆ 4.5</p>

                <p><strong>Departure:</strong> 09:30 AM</p>

                <p><strong>Arrival:</strong> 04:00 PM</p>

                <p><strong>Duration:</strong> 6h 30m</p>

            </div>

            <div class="bus-right">

                <p>Seats Left</p>

                <h2>12</h2>

                <p>AC Seater</p>

                <h3>₹550</h3>

                <button onclick="location.href='seats.html'">
                    View Seats
                </button>

            </div>

        </div>

    </div>

</section>

</body>

</html>
